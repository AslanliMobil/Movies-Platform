databaseChangeLog:
  - changeSet:
      id: update-wishlists-table-v2
      author: Aslanli
      changes:
        - addColumn:
            tableName: wishlists
            columns:
              - column:
                  name: note
                  type: VARCHAR(500)
                  remarks:


        - addDefaultValue:
            tableName: wishlists
            columnName: created_at
            defaultValueComputed: CURRENT_TIMESTAMP


        - createIndex:
            indexName: idx_wishlists_movie_id
            tableName: wishlists
            columns:
              - column:
                  name: movie_id


        - addNotNullConstraint:
            tableName: wishlists
            columnName: created_at
            columnDataType: TIMESTAMP