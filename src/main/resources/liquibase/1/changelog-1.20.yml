databaseChangeLog:
  - changeSet:
      id: add-video-url-to-movies-v1
      author: Aslanli
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: movies
                columnName: video_url
      changes:
        - addColumn:
            tableName: movies
            columns:
              - column:
                  name: video_url
                  type: VARCHAR(500)
                  remarks:


        - createIndex:
            indexName: idx_movies_video_url
            tableName: movies
            columns:
              - column:
                  name: video_url